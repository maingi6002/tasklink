<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - TaskLink</title>
<meta name="description" content="Create a TaskLink account and start applying to verified remote jobs today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1A4E'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='%23fff' font-size='18' font-weight='bold' font-family='Inter'%3ETL%3C/text%3E%3C/svg%3E">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="top-bar">
  <div class="container">
    <nav class="top-bar-nav" aria-label="Top navigation">
      <a href="index.html">Home</a>
      <a href="jobs.html">Browse Jobs</a>
      <a href="company/index.html">Employers</a>
      <a href="blog.html">Resources</a>
    </nav>
    <div class="top-bar-actions">
      <a href="login.html">For Job Seekers</a>
      <a href="company/index.html">For Employers</a>
      <a href="register.html" class="btn-cta-small">Join Now</a>
    </div>
  </div>
</div>

<header class="main-header">
  <div class="container">
    <a href="index.html" class="logo">
      <div class="logo-icon">TL</div>
      <span class="logo-text">Task<span>Link</span></span>
    </a>
    <nav class="header-nav" id="mainNav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="jobs.html">Remote Jobs</a>
      <a href="companies.html">Companies</a>
      <a href="blog.html">Career Advice</a>
      <a href="pricing.html">Pricing</a>
      <a href="faq.html">FAQ</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn-outline">Sign In</a>
      <a href="register.html" class="btn-primary">Get Started</a>
    </div>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>

<main id="main-content">

<section class="auth-page">
  <div class="auth-page-box auth-page-box--wide">
    <div class="auth-page-icon">TL</div>
    <h1>Create Your Account</h1>
    <p class="auth-page-sub">Join thousands of professionals working remotely</p>
    <form id="registerForm">
      <div class="auth-error" id="regError"></div>
      <div class="auth-success" id="regSuccess"></div>
      <div class="form-row">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" placeholder="+254 7XX XXX XXX" required>
        </div>
        <div class="form-group">
          <label for="regCountry">Country</label>
          <input type="text" id="regCountry" placeholder="e.g. Kenya" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="regContinent">Continent</label>
          <select id="regContinent" required>
            <option value="">Select continent</option>
            <option value="Africa">Africa</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="North America">North America</option>
            <option value="South America">South America</option>
            <option value="Australia/Oceania">Australia/Oceania</option>
          </select>
        </div>
        <div class="form-group">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" placeholder="Min 6 characters" required>
        </div>
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>
    <p class="auth-page-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</section>

</main>

<script src="js/script.js"></script>
</body>
</html>
